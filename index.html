<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Секционные тарелки для малышей</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ec;color:#3a3330;font-family:'Nunito',sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:36px 18px 60px}
h1{font-size:30px;font-weight:900;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}
h2{font-size:19px;font-weight:700;margin:0 0 12px;color:#7a6a5c}
img{width:100%;display:block;border-radius:16px;box-shadow:0 12px 32px rgba(70,50,30,.14)}
</style></head><body><div class="wrap">
<h1>Секционные тарелки для малышей</h1>
<div class="grid">
<figure style="margin:0"><h2>Машинка</h2><img src="mashinka.jpg" alt="Секционная тарелка машинка"></figure>
<figure style="margin:0"><h2>Зайка</h2><img src="zayka.jpg" alt="Секционная тарелка зайка"></figure>
</div></div></body></html>
